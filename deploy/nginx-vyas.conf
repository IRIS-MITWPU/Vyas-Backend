# /etc/nginx/conf.d/vyas.conf — native Nginx on the EC2 host (Amazon Linux 2023: conf.d, no sites-enabled).
# Install:  sudo cp deploy/nginx-vyas.conf /etc/nginx/conf.d/vyas.conf && sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d api.vyas.iris-club.in   (adds the 443 server block and the 80->443 redirect)
# app.js sets trust proxy = 1 in production, which matches this single Nginx hop, so the limiter keys
# on the real client IP (X-Forwarded-For as appended below). No HSTS here: helmet already sends it.

server_tokens off; # http-level directive; fine in conf.d (included inside http {})

server {
    listen 80;
    server_name api.vyas.iris-club.in;

    client_max_body_size 50m; # matches IMPORT_CONFIG.maxFileSizeMb

    # Bull Board exposes queued job data (reset links, OTP ciphertext, import content): never public.
    # Reach it through an SSH tunnel to 127.0.0.1:3000. Regex + ~* because Express routing is
    # case-insensitive, so a plain prefix location would let /ADMIN/QUEUES through.
    location ~* ^/admin/queues {
        return 404;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # long-lived WebSocket
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
