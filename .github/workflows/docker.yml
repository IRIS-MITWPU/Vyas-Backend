# Image build + lint + CVE scan. Separate from `npm test`, which needs a live DB.
name: docker

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN — this job only reads the repo.
permissions:
  contents: read

# Every action is pinned to a full commit SHA: tags are mutable (trivy-action had
# 76 of 77 tags force-pushed to credential-stealing code on 2026-03-19,
# GHSA-69fq-xp46-6x23). Dependabot (.github/dependabot.yml) keeps these current.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      # Needs outbound access to cdn.sheetjs.com (xlsx) as well as registry.npmjs.org.
      - run: docker build -t vyas-backend:${{ github.sha }} .

      # v0.35.0 is the first post-incident release (immutable). Scanner pinned to
      # v0.69.3 — the advisory's verified-safe build; never v0.69.4–v0.69.6.
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          image-ref: vyas-backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
